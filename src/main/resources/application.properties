spring.application.name=discord-mcp
server.port=8085

spring.ai.mcp.server.name=discord-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.stdio=true

# Default mode (backward compatible): stdio transport.
spring.main.web-application-type=none
spring.main.banner-mode=off

# Logging is configured in logback-spring.xml to keep stdout clean in stdio mode.

logging.file.name=./target/logs/discord-mcp-server.log

# HTTP authentication is required even when servlet mode is enabled without the http profile.
# Stdio mode does not register the HTTP authentication filter.
mcp.auth.enabled=${MCP_AUTH_ENABLED:true}
mcp.auth.token=${MCP_AUTH_TOKEN:}

# Only health may be activated by exposure settings, including a wildcard override.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never

# Optional browser login and OAuth authorization for remote MCP clients.
mcp.oauth.enabled=${MCP_OAUTH_ENABLED:false}
mcp.oauth.issuer=${MCP_OAUTH_ISSUER:}
mcp.oauth.username=${MCP_OAUTH_USERNAME:}
mcp.oauth.password=${MCP_OAUTH_PASSWORD:}
mcp.oauth.data-dir=${MCP_OAUTH_DATA_DIR:./data/oauth}
mcp.oauth.access-token-seconds=${MCP_OAUTH_ACCESS_TOKEN_SECONDS:900}
mcp.oauth.refresh-token-days=${MCP_OAUTH_REFRESH_TOKEN_DAYS:90}

# Browser login is served through the HTTPS origin configured for OAuth.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

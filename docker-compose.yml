services:
  discord-mcp-auth:
    container_name: discord-mcp-auth
    build:
      context: .
    image: nmbgeek/discord-mcp-auth:latest
    restart: unless-stopped
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-http}
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-true}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_USERNAME: ${MCP_OAUTH_USERNAME:-}
      MCP_OAUTH_PASSWORD: ${MCP_OAUTH_PASSWORD:-}
      MCP_OAUTH_DATA_DIR: /app/data/oauth
      MCP_OAUTH_ACCESS_TOKEN_SECONDS: ${MCP_OAUTH_ACCESS_TOKEN_SECONDS:-900}
      MCP_OAUTH_REFRESH_TOKEN_DAYS: ${MCP_OAUTH_REFRESH_TOKEN_DAYS:-90}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
    volumes:
      - oauth-data:/app/data/oauth
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  oauth-data:
